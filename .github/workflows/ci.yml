name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node 24, DSH rc.2 dev packages)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check (JS + JSDoc)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Offline integration tests (in-process real DSH packages)
        run: npm run test:integration
      - name: Packaging checks
        run: npm run pack:check
      - name: Packaging smoke test (packed tarball CLI)
        run: npm run pack:smoke

  verify-dsh-rc3:
    name: verify against DSH rc.3 packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Point the dev/test DSH packages at 0.2.1-rc.3
        run: |
          # Resolve a fresh, coherent rc.3 peer graph, rather than updating the
          # installed rc.2 graph whose transitive peers are pinned to rc.2.
          node --input-type=module -e "
            import fs from 'node:fs';
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const name of Object.keys(pkg.devDependencies)) {
              if (name.startsWith('@deepseek-ai/dsh-')) pkg.devDependencies[name] = '0.2.1-rc.3';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            fs.unlinkSync('package-lock.json');
          "
          npm install --ignore-scripts --no-audit --no-fund
      - name: Integration tests against rc.3
        run: npm run test:integration

  package:
    name: package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pack the plugin (npm pack)
        run: |
          mkdir -p dist
          npm pack --pack-destination ./dist
      - name: Verify the tarball contents
        run: |
          node -e "
            const { execFileSync } = require('node:child_process');
            const tar = require('node:fs').readdirSync('dist').find((f) => f.endsWith('.tgz'));
            if (!tar) { console.error('no tarball produced'); process.exit(1); }
            const list = execFileSync('tar', ['-tzf', 'dist/' + tar], { encoding: 'utf8' });
            for (const required of ['package/lib/index.js', 'package/cordis.patch.yml', 'package/LICENSE', 'package/NOTICE', 'package/bin/te.js']) {
              if (!list.includes(required)) { console.error('missing ' + required); process.exit(1); }
            }
            console.log('tarball ok: dist/' + tar);
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-tokeneconomizer-tarball
          path: dist/*.tgz
          if-no-files-found: error
